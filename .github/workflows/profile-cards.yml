

name: Update profile cards

on:
  # Refresh stats and language cards four times daily.
  # GitHub Actions schedule times are in UTC.
  schedule:
    - cron: "17 */6 * * *"

  # Allow a manual refresh from the Actions tab.
  workflow_dispatch:

  # Also refresh when you push changes to this profile repository.
  # The card action's generated commit uses [skip ci] to avoid loops.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: smaharx
          cards: overview,languages,contributions
          output-dir: assets
          themes: light,dark
          commit: true
